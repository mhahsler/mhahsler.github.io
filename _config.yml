title: Michael Hahsler
author:
  name: Michael Hahsler
  url: https://orcid.org/0000-0003-2716-1405
email: mhahsler@smu.edu
description: >-
  Clinical Associate Professor of Computer Science at SMU,
  Artificial Intelligence Researcher, and Software Developer.

# This repository is named "home", so its default GitHub Pages address is
# https://mhahsler.github.io/home/. Change baseurl to "" if the repository is
# renamed to mhahsler.github.io or a custom domain is configured.
url: "https://michael.hahsler.net"
baseurl: ""

github_username: mhahsler
linkedin_username: mhahsler
orcid: https://orcid.org/0000-0003-2716-1405

social:
  name: Michael Hahsler
  links:
    - https://orcid.org/0000-0003-2716-1405
    - https://scholar.google.com/citations?user=uUg1IykAAAAJ
    - https://github.com/mhahsler
    - https://www.linkedin.com/in/mhahsler

twitter:
  card: summary_large_image

defaults:
  - scope:
      path: ""
    values:
      image:
        path: /assets/img/social-card.jpg
        width: 1200
        height: 630
        alt: Michael Hahsler — AI, Optimization, and Data Science

theme: minima
show_excerpts: false

# Minima 2.5 still uses Sass's legacy @import internally. Suppress that
# dependency warning until the theme ships its module-system migration.
sass:
  silence_deprecations:
    - import

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - old_home
  - vendor
